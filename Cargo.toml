[package]
name = "literec"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[features]
default = ["app-audio"]
# Per-application audio (Windows 10 2004+). If the `wasapi` crate API gives you trouble,
# build with: cargo build --release --no-default-features
app-audio = ["dep:wasapi"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
windows-capture = "~1.4"
dxgi-capture-rs = "1.2"
cpal = "0.15"
wasapi = { version = "0.17", optional = true }
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
parking_lot = "0.12"
anyhow = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
